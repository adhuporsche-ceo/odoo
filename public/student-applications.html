<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Review | Student Profiling System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-wrapper">
    <main id="main-content">
      <div class="page-container">
        
        <!-- Header -->
        <div class="page-header">
          <div>
            <h3 class="page-title d-flex align-items-center gap-2">
              <i class="bi bi-file-earmark-person-fill text-primary"></i> Student Application Review
            </h3>
            <p class="page-subtitle">Review submissions before adding them to the student directory.</p>
          </div>
          <div class="d-flex gap-2">
            <a href="student-form.html" class="btn btn-primary d-flex align-items-center gap-2">
              <i class="bi bi-plus-circle"></i> Submit Application Form
            </a>
            <button class="btn btn-outline-secondary" id="refreshApplications" type="button" aria-label="Refresh applications" title="Refresh">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="card p-3 mb-3 border bg-light shadow-sm">
          <div class="row g-2 align-items-center">
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1" for="applicationStatus">Status</label>
              <select class="form-select form-select-sm" id="applicationStatus">
                <option value="PENDING" selected>Pending</option>
                <option value="APPROVED">Approved</option>
                <option value="REJECTED">Rejected</option>
                <option value="ALL">All Submissions</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1" for="filterDept">Department</label>
              <select class="form-select form-select-sm" id="filterDept">
                <option value="ALL">All Departments</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
                <option value="AIDS">AI &amp; DS</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted mb-1" for="searchApplications">Live Search</label>
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchApplications" placeholder="Search by name, reg no...">
              </div>
            </div>
            <div class="col-md-2 text-md-end pt-md-3">
              <span class="badge bg-primary fs-6 px-3 py-2" id="applicationCount">0 applications</span>
            </div>
          </div>
        </div>

        <div id="applicationMessage" class="alert d-none" role="status"></div>
        
        <!-- Applications Table -->
        <div class="table-responsive card border shadow-sm">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light text-uppercase small text-muted">
              <tr>
                <th scope="col" style="min-width: 140px;">Register number</th>
                <th scope="col" style="min-width: 180px;">Student</th>
                <th scope="col" style="min-width: 130px;">Department</th>
                <th scope="col" style="min-width: 160px;">Submitted</th>
                <th scope="col" style="min-width: 120px;">Application</th>
                <th scope="col" class="text-end" style="min-width: 160px;">Review</th>
              </tr>
            </thead>
            <tbody id="applicationsTableBody"></tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Detailed Application Review Modal -->
  <div class="modal fade" id="applicationDetailModal" tabindex="-1" aria-labelledby="appModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title d-flex align-items-center gap-2" id="appModalTitle">
            <i class="bi bi-person-vcard"></i> Student Application Dossier
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <ul class="nav nav-tabs nav-fill bg-light border-bottom" id="appTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active py-2 small fw-semibold" id="tab-personal-btn" data-bs-toggle="tab" data-bs-target="#tab-personal" type="button" role="tab">Personal &amp; Contact</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link py-2 small fw-semibold" id="tab-family-btn" data-bs-toggle="tab" data-bs-target="#tab-family" type="button" role="tab">Family Details</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link py-2 small fw-semibold" id="tab-academic-btn" data-bs-toggle="tab" data-bs-target="#tab-academic" type="button" role="tab">Academics &amp; Arrears</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link py-2 small fw-semibold" id="tab-technical-btn" data-bs-toggle="tab" data-bs-target="#tab-technical" type="button" role="tab">Technical &amp; Projects</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link py-2 small fw-semibold" id="tab-career-btn" data-bs-toggle="tab" data-bs-target="#tab-career" type="button" role="tab">Career Goals</button>
            </li>
          </ul>

          <div class="tab-content p-3" id="appTabContent">
            <!-- 1. Personal -->
            <div class="tab-pane fade show active" id="tab-personal" role="tabpanel">
              <div id="modalPersonalContent"></div>
            </div>
            <!-- 2. Family -->
            <div class="tab-pane fade" id="tab-family" role="tabpanel">
              <div id="modalFamilyContent"></div>
            </div>
            <!-- 3. Academic -->
            <div class="tab-pane fade" id="tab-academic" role="tabpanel">
              <div id="modalAcademicContent"></div>
            </div>
            <!-- 4. Technical -->
            <div class="tab-pane fade" id="tab-technical" role="tabpanel">
              <div id="modalTechnicalContent"></div>
            </div>
            <!-- 5. Career -->
            <div class="tab-pane fade" id="tab-career" role="tabpanel">
              <div id="modalCareerContent"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger btn-sm" id="modalDeleteBtn">
            <i class="bi bi-trash me-1"></i> Delete Application
          </button>
          <div class="d-flex gap-2" id="modalActionButtons">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-danger btn-sm" id="modalRejectBtn">
              <i class="bi bi-x-lg me-1"></i> Reject
            </button>
            <button type="button" class="btn btn-success btn-sm" id="modalApproveBtn">
              <i class="bi bi-check-lg me-1"></i> Approve &amp; Create Profile
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student-applications.js"></script>
</body>
</html>
