<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPS Portal Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page auth-page--login">
    <section class="auth-card auth-card--login" aria-labelledby="loginHeading">
      <div class="auth-wordmark" aria-label="Student Profiling System">
        <span class="auth-wordmark-icon"><i class="bi bi-mortarboard-fill"></i></span>
        <span class="auth-wordmark-text"><strong>SPS</strong><small>STUDENT PROFILE SYSTEM</small></span>
      </div>
      <div class="auth-portal-label">ACADEMIC &amp; CAREER PORTAL</div>
      <h1 id="loginHeading" class="auth-login-title">Portal Login</h1>
      <div id="loginAlert" class="auth-alert d-none" role="alert"><span id="loginAlertText"></span></div>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-field">
          <i class="bi bi-envelope-fill" aria-hidden="true"></i>
          <label class="visually-hidden" for="email">Email or register number</label>
          <input id="email" name="email" class="auth-input" autocomplete="username" placeholder="Email or register number" required>
        </div>
        <div class="auth-field">
          <i class="bi bi-lock-fill" aria-hidden="true"></i>
          <label class="visually-hidden" for="password">Password</label>
          <input id="password" name="password" type="password" class="auth-input" autocomplete="current-password" placeholder="Password" required>
          <button type="button" id="togglePasswordBtn" class="btn btn-link text-white-50 p-0 me-2" style="background:none;border:none;box-shadow:none;" aria-label="Toggle password visibility">
            <i id="togglePasswordIcon" class="bi bi-eye"></i>
          </button>
        </div>
        <div class="auth-options">
          <label class="auth-remember"><input type="checkbox" id="rememberMe"><span>Remember me</span></label>
          <button id="passwordHelpBtn" class="auth-help" type="button">Forgot password?</button>
        </div>
        <button id="loginBtn" class="auth-submit" type="submit">
          <span id="loginBtnText">Login</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
        </button>
        <div class="mt-3 text-center">
          <small class="text-white-50 d-block mb-1" style="font-size: 0.72rem;">Quick 1-Click Demo Accounts:</small>
          <div class="d-flex flex-wrap gap-1 justify-content-center">
            <button type="button" class="btn btn-sm btn-outline-light py-0 px-2 demo-fill-btn" data-email="admin@college.edu" data-pass="Admin@123" style="font-size: 0.72rem; border-radius: 12px;">Admin</button>
            <button type="button" class="btn btn-sm btn-outline-light py-0 px-2 demo-fill-btn" data-email="coordinator@college.edu" data-pass="Coordinator@123" style="font-size: 0.72rem; border-radius: 12px;">Coordinator</button>
            <button type="button" class="btn btn-sm btn-outline-light py-0 px-2 demo-fill-btn" data-email="faculty@college.edu" data-pass="Mentor@123" style="font-size: 0.72rem; border-radius: 12px;">Mentor</button>
            <button type="button" class="btn btn-sm btn-outline-light py-0 px-2 demo-fill-btn" data-email="student@college.edu" data-pass="Student@123" style="font-size: 0.72rem; border-radius: 12px;">Student</button>
          </div>
        </div>
      </form>
      <a class="auth-secondary-submit" href="student-signup.html">Create student account</a>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
