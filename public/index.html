<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Academic Personal and Career Profiling System</title>
  <meta name="description" content="Student Academic Personal and Career Profiling System for College Mentors & Faculty">
  <meta property="og:title" content="Student Academic Personal and Career Profiling System">
  <meta property="og:description" content="Student Academic Personal and Career Profiling System for College Mentors & Faculty">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="text-center p-4">
    <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h4 class="fw-bold" style="color: var(--fg);">Student Profiling System</h4>
    <p class="text-muted">Directing to college mentoring portal...</p>
  </div>

  <script>
    const token = localStorage.getItem('sps_token');
    const user = localStorage.getItem('sps_user');
    const isPreviewToken = token === 'local-frontend-preview';
    if (isPreviewToken) {
      localStorage.removeItem('sps_token');
      localStorage.removeItem('sps_user');
    }
    window.location.replace(token && user && !isPreviewToken ? 'dashboard.html' : 'login.html');
  </script>
</body>
</html>
