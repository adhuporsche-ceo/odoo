<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Audit Logs | Student Profiling System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-wrapper">
    <main id="main-content">
      <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h3 class="page-title">Security & Operations Audit Logs</h3>
            <p class="page-subtitle">Chronological record of student profile creation, updates, deletions, and faculty actions.</p>
          </div>
          <span class="badge bg-danger p-2 fs-6"><i class="bi bi-shield-lock-fill me-1"></i> Administrator Access Only</span>
        </div>

        <!-- Filter Card -->
        <div class="custom-card mb-3">
          <div class="card-body">
            <div class="row g-3 align-items-center">
              <div class="col-md-5">
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                  <input
                    type="text"
                    id="auditSearchInput"
                    class="form-control"
                    placeholder="Search user, student, or action details..."
                  />
                </div>
              </div>

              <div class="col-md-4">
                <select id="auditActionFilter" class="form-select">
                  <option value="">All Action Types</option>
                  <option value="LOGIN">User Logins</option>
                  <option value="STUDENT_CREATED">Student Created</option>
                  <option value="STUDENT_UPDATED">Student Updated</option>
                  <option value="STUDENT_DELETED">Student Deleted</option>
                  <option value="SEMESTER_ADDED">Semester Added</option>
                  <option value="ARREAR_ADDED">Arrear Added</option>
                  <option value="ARREAR_UPDATED">Arrear Updated</option>
                  <option value="INTERVENTION_ADDED">Mentor Intervention Added</option>
                  <option value="SYSTEM_SEED">System Seed</option>
                </select>
              </div>

              <div class="col-md-3 text-end">
                <button type="button" class="btn btn-outline-secondary" onclick="resetAuditFilters()">
                  <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Filters
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Audit Table Card -->
        <div class="custom-card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table custom-table mb-0">
                <thead>
                  <tr>
                    <th>Timestamp</th>
                    <th>User / Faculty</th>
                    <th>Action</th>
                    <th>Affected Student</th>
                    <th>Action Details</th>
                  </tr>
                </thead>
                <tbody id="auditTableBody">
                  <tr>
                    <td colspan="5" class="text-center py-5">
                      <div class="spinner-border text-primary" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Pagination Bar -->
            <div class="p-3 border-top d-flex align-items-center justify-content-between flex-wrap gap-2">
              <div class="small text-muted" id="auditPaginationInfo">Showing page 1</div>
              <ul class="pagination pagination-sm mb-0" id="auditPaginationList"></ul>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/audit-logs.js"></script>
</body>
</html>
