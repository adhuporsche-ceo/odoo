<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Account Registration | SPS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page auth-page--signup">
    <section class="auth-card auth-card--signup" aria-labelledby="signupHeading">
      <div class="auth-avatar auth-avatar--small" aria-hidden="true"><i class="bi bi-person-plus-fill"></i></div>
      <p class="auth-brand">SPS / STUDENT PORTAL</p>
      <h1 id="signupHeading" class="auth-title">Create account</h1>
      <p class="auth-description">Register with your college details.</p>
      <div id="signupAlert" class="auth-alert d-none" role="alert"></div>
      <form id="signupForm" class="auth-form auth-form--signup">
        <div class="auth-field auth-field--labeled">
          <label for="name">Full name</label>
          <input class="auth-input" id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="auth-field auth-field--labeled">
          <label for="email">Institutional email</label>
          <input class="auth-input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-grid">
          <div class="auth-field auth-field--labeled">
            <label for="registerNumber">Register number</label>
            <input class="auth-input" id="registerNumber" name="registerNumber" autocomplete="off" required>
          </div>
          <div class="auth-field auth-field--labeled">
            <label for="department">Department</label>
            <select class="auth-input auth-select" id="department" name="department" required>
              <option value="CSE">CSE</option>
              <option value="IT">IT</option>
              <option value="ECE">ECE</option>
              <option value="EEE">EEE</option>
              <option value="MECH">MECH</option>
              <option value="CIVIL">CIVIL</option>
              <option value="AIDS">AI &amp; Data Science</option>
            </select>
          </div>
        </div>
        <div class="auth-grid">
          <div class="auth-field auth-field--labeled">
            <label for="password">Password (8+ characters)</label>
            <input class="auth-input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="auth-field auth-field--labeled">
            <label for="confirmPassword">Confirm password</label>
            <input class="auth-input" id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
          </div>
        </div>
        <button id="signupButton" class="auth-submit" type="submit">Create student account</button>
      </form>
      <p class="auth-footer">Already registered? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script src="js/student-signup.js"></script>
</body>
</html>
